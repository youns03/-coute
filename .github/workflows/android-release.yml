name: Android Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release v')
    name: Build and publish signed ABI APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag and set Android version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            if [[ "${COMMIT_MESSAGE}" =~ \\[release\\ (v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?)\\] ]]; then
              TAG="${BASH_REMATCH[1]}"
            else
              echo "::error::Main-branch release commits must include [release vMAJOR.MINOR.PATCH] in the commit message."
              exit 1
            fi
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid vMAJOR.MINOR.PATCH SemVer tag. Example: v1.0.0"
            exit 1
          fi
          if [[ ! "${GITHUB_RUN_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::GITHUB_RUN_NUMBER is not numeric"
            exit 1
          fi
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          if (( VERSION_CODE > 2100000000 )); then
            echo "::error::Calculated Android versionCode exceeds the supported maximum"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Preparing $TAG with versionCode $VERSION_CODE"

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 repository secret before creating a release tag"
            exit 1
          fi
          CLEAN_KEYSTORE_BASE64="$ANDROID_KEYSTORE_BASE64"
          if [[ "$CLEAN_KEYSTORE_BASE64" == *"<textarea"* ]]; then
            CLEAN_KEYSTORE_BASE64="${CLEAN_KEYSTORE_BASE64#*>}"
            CLEAN_KEYSTORE_BASE64="${CLEAN_KEYSTORE_BASE64%%</textarea>*}"
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/ecoute-release.jks"
          printf '%s' "$CLEAN_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::The decoded keystore is empty"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      # Main-branch runs are gated by [release] in the commit message; tag pushes remain supported.
      # Build ABI-specific APKs first. The ARM64 APK is the primary direct-download artifact.
      - name: Build signed ABI-split release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease -PsplitApkByAbi=true

      - name: Preserve ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          ARM64_APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*arm64-v8a*.apk' -print -quit)"
          if [[ -z "$ARM64_APK" || ! -f "$ARM64_APK" ]]; then
            echo "::error::The ABI-split build did not produce an ARM64 APK"
            find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi
          mkdir -p release-artifacts
          cp "$ARM64_APK" "release-artifacts/Ecoute-${ANDROID_VERSION_NAME}-arm64-v8a.apk"
          echo "ARM64 APK: $(stat -c '%s bytes' "$ARM64_APK")"

      # Build the universal APK separately so it remains available as a compatibility fallback.
      - name: Build signed universal release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify and prepare release APKs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          UNIVERSAL_APK="$APK_DIR/app-release.apk"
          ARM64_APK="release-artifacts/Ecoute-${ANDROID_VERSION_NAME}-arm64-v8a.apk"
          if [[ ! -s "$UNIVERSAL_APK" || ! -s "$ARM64_APK" ]]; then
            echo "::error::Expected ARM64 and universal APKs are both required"
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$ARM64_APK"
          "$APKSIGNER" verify --verbose "$UNIVERSAL_APK"

          ARM64_ABIS="$(unzip -Z1 "$ARM64_APK" | awk -F/ '$1 == "lib" && NF >= 3 {print $2}' | sort -u)"
          if [[ "$ARM64_ABIS" != "arm64-v8a" ]]; then
            echo "::error::ARM64 APK contains unexpected ABI set: '$ARM64_ABIS'"
            exit 1
          fi

          UNIVERSAL_ABIS="$(unzip -Z1 "$UNIVERSAL_APK" | awk -F/ '$1 == "lib" && NF >= 3 {print $2}' | sort -u)"
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            if ! grep -qx "$ABI" <<< "$UNIVERSAL_ABIS"; then
              echo "::error::Universal APK is missing ABI $ABI"
              exit 1
            fi
          done

          cp "$UNIVERSAL_APK" "release-artifacts/Ecoute-${ANDROID_VERSION_NAME}-universal.apk"
          echo "Verified ARM64 APK: $(stat -c '%s bytes' "$ARM64_APK")"
          echo "Verified universal APK: $(stat -c '%s bytes' "$UNIVERSAL_APK")"
          sha256sum "$ARM64_APK" "$UNIVERSAL_APK" | tee release-artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/ecoute-release.jks"
